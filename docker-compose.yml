version: "3.8"

services:

  client:
    build: ./client
    container_name: zoo-client
    ports:
      - "3000:3000"
    stdin_open: true
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - server

  server:
    build: ./server
    container_name: zoo-server
    ports:
      - "5001:5000"
    env_file:
      - ./server/.env